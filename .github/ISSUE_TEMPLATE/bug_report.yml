name: Bug report
description: Something does not work as described in the documentation.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a problem. The **Search and test the TVs** button of the configuration often tells where it stops: paste its message below.
  - type: input
    id: gladys-version
    attributes:
      label: Gladys version
      description: Settings → System.
      placeholder: '5.2.1'
    validations:
      required: true
  - type: input
    id: integration-version
    attributes:
      label: Integration version
      description: Integrations → Xiaomi TV, Supervision tab.
      placeholder: '0.1.0'
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: TV
      description: The model of the TV (back label or Settings → About), its system (PatchWall / MIUI TV version) and its `XIAOMI_TV_PLATFORM` device parameter in Gladys.
      placeholder: 'Mi TV 4S 55, PatchWall 3, platform 630'
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened, and what you expected
      description: What `http://<TV address>:6095/request?action=isalive` answers in a browser helps a lot.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: |
        Logs of the integration (Logs tab of the integration page), ideally with the SDK debug logs: add the environment variable `DEBUG=gladys-integration-sdk` to the container, reproduce, then copy the lines.
      render: text
